<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Member Login — AI Learning Circle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shared.css">
</head>
<body>

<nav class="topnav">
  <a href="index.html" class="brand"><img src="assets/logo.svg" alt="AI Learning Circle"></a>
</nav>

<div class="wrap">
  <div class="auth-shell">
    <div class="eyebrow">Member login</div>
    <h1>Welcome back</h1>
    <p class="sub">Log in to reach your dashboard, free AI tips and your profile.</p>

    <div class="form-msg" id="form-msg"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary" type="submit" id="submit-btn" style="width:100%;">Log in</button>
    </form>

    <div class="auth-switch">Not a member yet? <a href="signup.html">Create an account</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/supabase-client.js"></script>
<script>
  const form = document.getElementById('login-form');
  const msg = document.getElementById('form-msg');
  const submitBtn = document.getElementById('submit-btn');

  function showMsg(text, kind) {
    msg.textContent = text;
    msg.className = 'form-msg show ' + kind;
  }

  // If already logged in, skip straight to the dashboard.
  (async () => {
    if (supabaseNotConfigured()) return;
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) window.location.href = 'dashboard.html';
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (supabaseNotConfigured()) {
      showMsg('Login isn’t connected yet — the site owner still needs to add the Supabase project keys.', 'error');
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in…';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      showMsg(error.message, 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in';
      return;
    }

    window.location.href = 'dashboard.html';
  });
</script>

</body>
</html>
