<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Feed — AI Learning Circle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shared.css?v=202610131212">
<style>
  .feed-header{margin:20px 0 4px;}
  .feed-header h1{font-size:24px;margin:4px 0 6px;}
  .feed-header p{font-size:14.5px;color:var(--slate-500);margin:0;}
  .post{margin:14px 0;}
  .post .when{font-size:12px;color:var(--slate-500);font-weight:600;}
  .post h3{margin:4px 0 8px;font-size:18px;}
  .post .text{font-size:14.5px;line-height:1.65;white-space:pre-wrap;}
  .post img.pic{display:block;width:100%;max-height:520px;object-fit:contain;background:var(--cream-200);border-radius:12px;margin:10px 0;}
  .post .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .text.clamp{max-height:9.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent);}
  .more{background:none;border:0;padding:6px 0 0;color:var(--navy-700);font-weight:700;font-family:inherit;font-size:13.5px;cursor:pointer;}
  .pin{font-size:11px;font-weight:800;color:var(--gold-600);letter-spacing:.06em;text-transform:uppercase;}
</style>
</head>
<body>

<nav class="topnav">
  <a href="index.html" class="brand"><img src="assets/logo.svg" alt="AI Learning Circle"></a>
  <div class="tabs" id="nav-tabs"></div>
</nav>

<div class="wrap">
  <div class="feed-header">
    <div class="eyebrow">Knowledge Library</div>
    <h1>AI Feed</h1>
    <p>Short reads, pictures, PDFs and links on using AI at work. Newest first.</p>
  </div>

  <div class="tab-chips" id="feed-tabs"></div>
  <div id="feed-list"><div class="empty-state">Loading…</div></div>
  <div class="cta-row" style="margin-top:18px;"><a class="btn btn-secondary" href="library.html">← Back to the Knowledge Library</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-config.js?v=202610131449"></script>
<script src="assets/supabase-client.js?v=202610131449"></script>
<script src="assets/member-menu.js?v=202610131449"></script>
<script>
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const safeUrl = (u) => /^https?:\/\//i.test(u || '') ? esc(u) : '';
  const FILTERS = [['all', 'All'], ['article', 'Articles'], ['image', 'Pictures'], ['pdf', 'PDFs'], ['link', 'Links']];
  let posts = [];
  let currentFilter = 'all';
  const listEl = document.getElementById('feed-list');

  function renderTabs() {
    document.getElementById('feed-tabs').innerHTML = FILTERS.map(([k, label]) =>
      `<button class="tab-chip ${k === currentFilter ? 'active' : ''}" data-f="${k}">${label}</button>`).join('');
    document.querySelectorAll('#feed-tabs .tab-chip').forEach(b => b.addEventListener('click', () => {
      currentFilter = b.dataset.f; renderTabs(); render();
    }));
  }

  async function signed(path, download) {
    const { data, error } = await supabaseClient.storage.from('library-files').createSignedUrl(path, 3600, download ? { download } : undefined);
    return error ? null : data.signedUrl;
  }

  async function openFile(path, name, inline) {
    if (/^https?:\/\//i.test(path)) { window.open(path, '_blank', 'noopener'); return; }
    const url = await signed(path, inline ? undefined : name);
    if (url) window.open(url, '_blank'); else alert('Could not open this file. Please try again.');
  }

  function render() {
    const shown = posts.filter(p => currentFilter === 'all' || p.kind === currentFilter || (currentFilter === 'pdf' && p.kind === 'file'));
    if (!shown.length) { listEl.innerHTML = '<div class="empty-state">Nothing here yet. New posts appear here as they are shared.</div>'; return; }
    listEl.innerHTML = shown.map(p => {
      const when = new Date(p.created_at).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
      const link = safeUrl(p.link_url);
      let actions = '';
      if (link) actions += `<a class="btn btn-dark" href="${link}" target="_blank" rel="noopener">Open link</a>`;
      if (p.file_path && p.kind !== 'image') {
        actions += `<button class="btn btn-dark" data-open="${esc(p.id)}">${p.kind === 'pdf' ? 'Open PDF' : 'Download'}${p.file_name ? ' · ' + esc(p.file_name) : ''}</button>`;
      }
      return `<div class="card post" id="post-${esc(p.id)}">
        <div class="when">${p.pinned ? '<span class="pin">Pinned</span> · ' : ''}${when}</div>
        <h3>${esc(p.title)}</h3>
        ${p.kind === 'image' && p.file_path ? `<img class="pic" data-img="${esc(p.id)}" alt="${esc(p.title)}">` : ''}
        ${p.body ? `<div class="text${p.body.length > 500 ? ' clamp' : ''}">${esc(p.body)}</div>${p.body.length > 500 ? '<button class="more">Read more</button>' : ''}` : ''}
        ${actions ? `<div class="actions">${actions}</div>` : ''}
      </div>`;
    }).join('');
    listEl.querySelectorAll('.more').forEach(b => b.addEventListener('click', () => {
      const t = b.previousElementSibling;
      const open = t.classList.toggle('clamp');
      b.textContent = open ? 'Read more' : 'Show less';
    }));
    listEl.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => {
      const p = posts.find(x => x.id === b.dataset.open);
      if (p) openFile(p.file_path, p.file_name, p.kind === 'pdf');
    }));
    listEl.querySelectorAll('img[data-img]').forEach(async (img) => {
      const p = posts.find(x => x.id === img.dataset.img);
      const url = p && await signed(p.file_path);
      if (url) img.src = url; else img.remove();
    });
  }

  function showLocked(loggedIn) {
    document.getElementById('feed-tabs').innerHTML = '';
    listEl.innerHTML = `<div class="card"><h3>🔒 The AI Feed is for members</h3>
      <p>Paid members get short reads, pictures and PDFs on using AI at work, along with the rest of the Knowledge Library.</p>
      <div class="cta-row" style="margin-top:12px;">
        <a class="btn btn-primary" href="${MEMBERSHIP_WHATSAPP_URL}" target="_blank" rel="noopener">Subscribe on WhatsApp</a>
        <a class="btn btn-secondary" href="index.html#membership">See membership</a>
        ${loggedIn ? '' : '<a class="btn btn-secondary" href="login.html">Log in</a>'}
      </div></div>`;
  }

  (async () => {
    if (supabaseNotConfigured()) { listEl.innerHTML = '<div class="empty-state">Not connected yet.</div>'; return; }
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      document.getElementById('nav-tabs').innerHTML = '<a class="tab-btn" href="login.html">Member Login</a>';
      showLocked(false);
      return;
    }
    const member = await getMemberRecord(session.user.id);
    document.getElementById('nav-tabs').innerHTML = `
      <a class="tab-btn" href="dashboard.html">Home</a>
      <a class="tab-btn active" href="library.html">Library</a>
      <a class="tab-btn" href="sessions.html">Sessions</a>
      <a class="tab-btn" href="profile.html">Profile</a>`;
    injectAdminTab(member);
    if (!isPaid(member)) { showLocked(true); return; }
    const { data, error } = await supabaseClient.from('feed_posts').select('*')
      .order('pinned', { ascending: false }).order('created_at', { ascending: false });
    if (error) { listEl.innerHTML = '<div class="empty-state">The feed is not set up yet. Please check back soon.</div>'; return; }
    posts = data || [];
    renderTabs();
    render();
  })();
</script>
</body>
</html>
