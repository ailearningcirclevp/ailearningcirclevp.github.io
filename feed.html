<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Feed — AI Learning Circle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shared.css?v=1791979287">
<style>
  .paper{max-width:980px;margin:18px auto 30px;background:#fffdf7;border:1px solid var(--line);border-radius:6px;padding:26px 30px 34px;box-shadow:0 12px 30px -22px rgba(11,23,48,.35);}
  .mast{text-align:center;border-bottom:3px double #1d3a8a;padding-bottom:12px;margin-bottom:6px;}
  .mast .kicker{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:#1d4ed8;font-weight:700;}
  .mast h1{font-family:'Fraunces',Georgia,serif;font-size:clamp(38px,8vw,64px);line-height:1;margin:8px 0 6px;letter-spacing:-.02em;color:#14307a;}
  .mast .tag{color:#1d4ed8 !important;font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:15px;color:#444;}
  .dateline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:#333;border-bottom:1px solid #1a1a1a;padding:7px 2px;margin-bottom:22px;}
  .story{padding:0 0 24px;margin:0 0 24px;border-bottom:1px solid #cfc8b4;}
  .story:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0;}
  .story .when{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold-600,#b45309);}
  .story h2{font-family:'Fraunces',Georgia,serif;font-size:clamp(22px,4vw,30px);line-height:1.18;margin:6px 0 12px;color:#14307a;}
  .story.lead h2{font-size:clamp(28px,6vw,44px);line-height:1.08;}
  .story .text{font-family:'Fraunces',Georgia,serif;font-size:16.5px;line-height:1.72;color:#1e3f94;white-space:pre-wrap;}
  @media (min-width:760px){
    .story.lead .text,.story .text.long{column-count:2;column-gap:36px;column-rule:1px solid #d9d2bd;}
    .story .text.long{column-count:2;}
  }
  .story .text::first-letter{}
  .story.lead .text::first-letter{font-size:3.2em;float:left;line-height:.85;padding:6px 8px 0 0;font-weight:700;}
  .story img.pic{display:block;width:100%;max-height:560px;object-fit:cover;border-radius:2px;margin:6px 0 14px;filter:grayscale(.05);}
  .story .figcap{font-size:12px;color:#666;font-style:italic;margin:-8px 0 14px;}
  .story .refs{margin-top:12px;font-size:14px;font-family:Inter,sans-serif;}
  .story .refs a,.story .refs span.ref{color:#1d4ed8;text-decoration:underline;text-underline-offset:3px;font-weight:600;cursor:pointer;margin-right:16px;display:inline-block;margin-top:4px;}
  .by{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#1d4ed8;margin:-4px 0 12px;}
  .topics{border-bottom:1px solid #1d3a8a;padding:14px 0 18px;margin-bottom:22px;}
  .topics-h{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:#1d4ed8;margin-bottom:10px;}
  .topics-sub{font-size:13px;color:#1d4ed8;margin:-4px 0 14px;}
  .tp{margin:0 auto 30px;max-width:500px;background:#f4f7ff;border:1px solid #c3cff0;border-radius:18px;padding:18px 18px 16px;box-shadow:0 8px 22px -16px rgba(20,48,122,.5);}
  .tp .tn{font-size:11px;font-weight:800;letter-spacing:.14em;color:#1d4ed8;}
  .tp h3{font-family:'Fraunces',Georgia,serif;font-size:21px;line-height:1.2;margin:4px 0 6px;color:#14307a;}
  .tp p{font-size:14.5px;line-height:1.55;color:#1e3f94;margin:0 0 12px;}
  .tcar{position:relative;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 10px 28px rgba(20,48,122,.2);}
  .ttrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .ttrack::-webkit-scrollbar{display:none}
  .ttrack img{flex:0 0 100%;width:100%;aspect-ratio:4/5;object-fit:cover;scroll-snap-align:center;display:block;}
  .tb{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:2px solid #14307a;background:#f2c94c;color:#14307a;font-size:24px;font-weight:700;cursor:pointer;line-height:1;padding:0;}
  .tb.pv{left:10px}.tb.nx{right:10px}.tb[disabled]{opacity:0;pointer-events:none}
  .tdots{display:flex;justify-content:center;gap:7px;margin-top:10px;}
  .tdots i{width:8px;height:8px;border-radius:50%;background:#c3cff0;}
  .tdots i.on{background:#1d4ed8;width:22px;border-radius:6px;}
  .tp .tl{display:block;text-align:center;font-size:13px;margin-top:8px;color:#1d4ed8;}
  .pin{font-size:11px;font-weight:800;color:#b91c1c;letter-spacing:.14em;text-transform:uppercase;}
  @media (max-width:600px){.paper{padding:18px 16px 26px;border-radius:0;border-left:0;border-right:0;}}
</style>
</head>
<body>

<nav class="topnav">
  <a href="index.html" class="brand"><img src="assets/logo.svg" alt="AI Learning Circle"></a>
  <div class="tabs" id="nav-tabs"></div>
</nav>

<div class="wrap" style="max-width:1040px;">
  <div class="paper">
    <div class="mast">
      <div class="kicker">Knowledge Library</div>
      <h1>The AI Feed</h1>
      <div class="tag">Short reads on using AI at work, from the AI Learning Circle</div>
    </div>
    <div class="topics">
      <div class="topics-h">AI Nuggets</div>
      <div class="topics-sub">Swipe each nugget left to right</div>
      <div id="topics-list"></div>
    </div>
    <div id="feed-list"><div class="empty-state">Loading…</div></div>
  </div>
  <div class="cta-row" style="margin:0 0 18px;text-align:center;"><a href="library.html" style="font-size:14px;">← Back to the Knowledge Library</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-config.js?v=1791979287"></script>
<script src="assets/supabase-client.js?v=1791979287"></script>
<script src="assets/member-menu.js?v=1791979287"></script>
<script>
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const safeUrl = (u) => /^https?:\/\//i.test(u || '') ? esc(u) : '';
  let posts = [];
    const listEl = document.getElementById('feed-list');
  const TOPICS = [["free-vs-paid-myth", "You don’t need to pay to start", "The belief that the clever AI features are locked behind a paid plan keeps many people from ever trying. Often it isn’t true. Some free plans already include skills, file creation and connectors, and free chat handles drafting, analysis and summaries well. Paying mostly buys more usage and top models. Try one real task on a free plan today, and pay only when free stops being enough.", 6], ["best-features-by-tool", "You don’t have to pick the “right” AI tool", "Choosing between ChatGPT, Gemini, Claude and Copilot feels like a high-stakes decision, but it isn’t one. Each has an edge: ChatGPT for voice and work mode, Gemini for quick slides and Gmail, Claude for analysis, skills and automation, and Copilot for your Microsoft world. Use them all, send each job to the one that fits, and switch when free credits run out. The tools change, but your skill stays.", 8], ["copilot-best-features", "You may already own more AI than you think", "If your company only gave you Copilot, it’s easy to feel you’re missing out. The paid version holds hidden features that most people never open: Scheduled Prompts, the Analyst Agent, Notebooks, Excel Agent Mode and custom agents. You may not have all of them yet, since rollout and admin settings decide what you see, so ask your IT team. Learn the idea on any tool, and it will carry over.", 9], ["connectors-explained", "You don’t have to copy-paste everything anymore", "Moving content between your apps and AI by hand is tiring, and a connector removes that step. It gives an AI tool secure access to one app, and you stay in control. Connect one low-risk app, such as your calendar, and ask a real question. Sign in as yourself, give the least access that works, and disconnect any time from Settings.", 6], ["prompt-guidance", "You don’t need the perfect prompt", "Many people stay away because they think they must memorise special prompts, but you don’t. Explain your situation the way you would brief a smart colleague: the goal, the context, the task and the format you want. The smarter the model, the less structure it needs. What matters more is context, so give more and leave less to guesswork.", 6], ["copilot-prompt-basics", "Start with six simple words in Copilot", "A hundred prompts is a daunting place to begin, so don’t start there. Six verbs cover most of an office day: summarise, draft, rewrite, explain, compare and plan. Try one in Outlook, Word, Excel or Teams, add your own details, and review before you send. The full list is in the Knowledge Library when you’re ready for more.", 5], ["ten-ai-tools", "You don’t need to know hundreds of tools. Ten will do.", "The sheer number of AI tools can make anyone feel behind. Ten cover most needs: ChatGPT, Claude, Gemini and Copilot to think and write, Perplexity and NotebookLM to research, Gamma and Canva to create, and Otter.ai and Zapier to capture and automate. Try one new tool a week, and don’t worry about the rest. The exhaustive list is in the Knowledge Library whenever you want it.", 6]];
  (function(){
    const box = document.getElementById('topics-list');
    box.innerHTML = TOPICS.map((t, i) => {
      let imgs = ''; for (let k = 1; k <= t[3]; k++) imgs += `<img ${k > 1 ? 'loading="lazy" ' : ''}alt="${esc(t[1])} card ${k} of ${t[3]}" src="feed/${t[0]}/card-${k}.webp">`;
      return `<section class="tp"><div class="tn">TOPIC ${i + 1}</div><h3>${esc(t[1])}</h3><div class="by">By Vishnupriya</div><p>${esc(t[2])}</p>
        <div class="tcar"><div class="ttrack">${imgs}</div><button class="tb pv" aria-label="Previous card">&#8249;</button><button class="tb nx" aria-label="Next card">&#8250;</button></div>
        <div class="tdots">${'<i></i>'.repeat(t[3])}</div><a class="tl" href="feed/${t[0]}/">Open this topic on its own page &rsaquo;</a></section>`;
    }).join('');
    box.querySelectorAll('.tp').forEach(sec => {
      const tr = sec.querySelector('.ttrack'), pv = sec.querySelector('.pv'), nx = sec.querySelector('.nx'), ds = [...sec.querySelectorAll('.tdots i')];
      const upd = () => { const k = Math.round(tr.scrollLeft / tr.clientWidth); ds.forEach((d, j) => d.classList.toggle('on', j === k)); pv.disabled = k === 0; nx.disabled = k === ds.length - 1; };
      tr.addEventListener('scroll', upd, { passive: true });
      pv.onclick = () => tr.scrollBy({ left: -tr.clientWidth, behavior: 'smooth' });
      nx.onclick = () => tr.scrollBy({ left: tr.clientWidth, behavior: 'smooth' });
      upd();
    });
  })();


  async function signed(path, download) {
    const { data, error } = await supabaseClient.storage.from('library-files').createSignedUrl(path, 3600, download ? { download } : undefined);
    return error ? null : data.signedUrl;
  }

  async function openFile(path, name, inline) {
    if (/^https?:\/\//i.test(path)) { window.open(path, '_blank', 'noopener'); return; }
    const url = await signed(path, inline ? undefined : name);
    if (url) window.open(url, '_blank'); else alert('Could not open this file. Please try again.');
  }

  function render() {
    if (!posts.length) { listEl.innerHTML = '<div class="empty-state">Nothing here yet. New stories appear here as they are shared.</div>'; return; }
    listEl.innerHTML = posts.map((p, i) => {
      const when = new Date(p.created_at).toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
      const link = safeUrl(p.link_url);
      let refs = '';
      if (link) refs += `<a href="${link}" target="_blank" rel="noopener">Read the full source &rarr;</a>`;
      if (p.file_path && p.kind === 'pdf') {
        refs += `<span class="ref" data-open="${esc(p.id)}">Read the attached PDF${p.file_name ? ' (' + esc(p.file_name) + ')' : ''} &rarr;</span>`;
      }
      const long = p.body && p.body.length > 900;
      return `<article class="story${i === 0 ? ' lead' : ''}" id="post-${esc(p.id)}">
        ${p.pinned ? '<div class="when"><span class="pin">Top story</span></div>' : ''}
        <h2>${esc(p.title)}</h2>
        <div class="by">By Vishnupriya</div>
        ${p.kind === 'image' && p.file_path ? `<img class="pic" data-img="${esc(p.id)}" alt="${esc(p.title)}">` : ''}
        ${p.body ? `<div class="text${long ? ' long' : ''}">${esc(p.body)}</div>` : ''}
        ${refs ? `<div class="refs">${refs}</div>` : ''}
      </article>`;
    }).join('');
    listEl.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => {
      const p = posts.find(x => x.id === b.dataset.open);
      if (p) openFile(p.file_path, p.file_name, p.kind === 'pdf');
    }));
    listEl.querySelectorAll('img[data-img]').forEach(async (img) => {
      const p = posts.find(x => x.id === img.dataset.img);
      const url = p && await signed(p.file_path);
      if (url) img.src = url; else img.remove();
    });
  }

  function showLocked(loggedIn) {
    listEl.innerHTML = `<div class="card"><h3>🔒 The AI Feed is for members</h3>
      <p>Paid members get short reads, pictures and PDFs on using AI at work, along with the rest of the Knowledge Library.</p>
      <div class="cta-row" style="margin-top:12px;">
        <a class="btn btn-primary" href="${MEMBERSHIP_WHATSAPP_URL}" target="_blank" rel="noopener">Subscribe on WhatsApp</a>
        <a class="btn btn-secondary" href="index.html#membership">See membership</a>
        ${loggedIn ? '' : '<a class="btn btn-secondary" href="login.html">Log in</a>'}
      </div></div>`;
  }

  (async () => {
    if (supabaseNotConfigured()) { listEl.innerHTML = '<div class="empty-state">Not connected yet.</div>'; return; }
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      document.getElementById('nav-tabs').innerHTML = '<a class="tab-btn" href="index.html">Home</a><a class="tab-btn active" href="feed.html">AI Feed</a><a class="tab-btn" href="login.html">Member Login</a>';
      showLocked(false);
      return;
    }
    const member = await getMemberRecord(session.user.id);
    document.getElementById('nav-tabs').innerHTML = `
      <a class="tab-btn" href="dashboard.html">Home</a>
      <a class="tab-btn" href="library.html">Library</a>
      <a class="tab-btn active" href="feed.html">AI Feed</a>
      <a class="tab-btn" href="sessions.html">Sessions</a>
      <a class="tab-btn" href="profile.html">Profile</a>`;
    injectAdminTab(member);
    if (!isPaid(member)) { showLocked(true); return; }
    const { data, error } = await supabaseClient.from('feed_posts').select('*')
      .order('pinned', { ascending: false }).order('created_at', { ascending: false });
    if (error) { listEl.innerHTML = '<div class="empty-state">The feed is not set up yet. Please check back soon.</div>'; return; }
    posts = data || [];
    render();
  })();
</script>
<script src="assets/site-footer.js?v=1791979287"></script>
</body>
</html>
