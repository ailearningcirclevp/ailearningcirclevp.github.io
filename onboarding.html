<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome — AI Learning Circle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shared.css?v=202610061103">
<style>
  .survey-frame{width:100%;height:70vh;border:1px solid var(--line);border-radius:16px;margin:20px 0;}
  .step-tag{font-size:12px;font-weight:700;color:var(--gold-600);text-transform:uppercase;letter-spacing:.06em;}
</style>
</head>
<body>

<nav class="topnav">
  <a href="index.html" class="brand"><img src="assets/logo.svg" alt="AI Learning Circle"></a>
</nav>

<div class="wrap" style="max-width:560px;margin-top:40px;">
  <div class="step-tag">Step 1</div>
  <h1 style="margin:6px 0 4px;">Welcome to AI Learning Circle</h1>
  <p style="color:var(--slate-500);font-size:14.5px;">Tell us where you are in your AI journey — it takes about two minutes and helps shape future sessions.</p>

  <div class="cta-row">
    <a class="btn btn-dark" id="survey-link" href="#" target="_blank" rel="noopener">1. Open the survey (new tab)</a>
  </div>
  <div class="cta-row">
    <button class="btn btn-primary" id="done-btn">2. I've completed it — take me to my dashboard</button>
    <button class="btn btn-secondary" id="skip-btn">Skip for now</button>
  </div>
  <div class="form-msg" id="form-msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-config.js?v=202610061030"></script>
<script src="assets/supabase-client.js?v=202610061030"></script>
<script>
  document.getElementById('survey-link').href = ONBOARDING_SURVEY_URL.replace('?embedded=true', '');
  const msg = document.getElementById('form-msg');
  let currentSession = null;

  (async () => {
    currentSession = await requireMember();
    if (!currentSession) return;
    const member = await getMemberRecord(currentSession.user.id);
    if (member && member.survey_completed) {
      window.location.href = 'dashboard.html';
    }
  })();

  document.getElementById('skip-btn').addEventListener('click', () => {
    document.getElementById('done-btn').click();
  });

  document.getElementById('done-btn').addEventListener('click', async () => {
    if (supabaseNotConfigured() || !currentSession) {
      window.location.href = 'dashboard.html';
      return;
    }
    const { error } = await supabaseClient
      .from('members')
      .update({ survey_completed: true })
      .eq('id', currentSession.user.id);
    if (error) {
      msg.textContent = 'Could not save that you completed the survey: ' + error.message;
      msg.className = 'form-msg show error';
      return;
    }
    window.location.href = 'dashboard.html';
  });
</script>

</body>
</html>
