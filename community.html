<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Know Your Community — AI Learning Circle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shared.css?v=202610061103">
<style>
  .wrap{max-width:1000px;}
  .member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;}
  .member-tile{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 16px 18px;}
  .member-photo{width:104px;height:104px;border-radius:50%;object-fit:cover;background:var(--cream-200);border:2px solid var(--line);margin-bottom:12px;}
  .member-photo.placeholder{display:flex;align-items:center;justify-content:center;font-family:'Fraunces',Georgia,serif;font-size:34px;color:var(--navy-700);}
  .member-name{margin:0;font-size:17px;}
  .member-role{font-size:13.5px;font-weight:600;color:var(--navy-700);margin:4px 0 0;}
  .member-co{font-size:13px;color:var(--slate-500);margin:2px 0 0;}
  .member-loc{font-size:12px;color:var(--slate-500);margin:2px 0 0;}
  .member-bio{font-size:13px;line-height:1.5;color:var(--ink-900);margin:10px 0 0;}
  .member-links{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px;}
  .member-link{display:inline-block;font-size:13px;color:var(--navy-700);text-decoration:none;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:6px 14px;}
</style>
</head>
<body>

<nav class="topnav">
  <a href="index.html" class="brand"><img src="assets/logo.svg" alt="AI Learning Circle"></a>
  <div class="tabs">
    <a class="tab-btn" href="index.html">Home</a>
    <a class="tab-btn active" href="community.html">Know Your Community</a>
    <a class="tab-btn" href="login.html">Member Login</a>
  </div>
</nav>

<div class="wrap">
  <div class="eyebrow" style="margin-top:20px;">Know Your Community</div>
  <h1 style="font-size:24px;margin:4px 0 10px;">The people behind AI Learning Circle</h1>
  <p style="font-size:14.5px;color:var(--slate-500);margin:0 0 24px;">A showcase of members who chose to share a bit about themselves — who they are, what they're working on, and where to find them.</p>

  <div id="member-list"><div class="empty-state">Loading…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-config.js?v=202610061030"></script>
<script src="assets/supabase-client.js?v=202610061030"></script>
<script>
  function initials(name) {
    return (name || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();
  }

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function safeUrl(u) {
    return /^https?:\/\//i.test(u || '') ? esc(u) : '';
  }

  function memberCard(m) {
    const photo = safeUrl(m.profile_photo_url)
      ? `<img class="member-photo" src="${safeUrl(m.profile_photo_url)}" alt="${esc(m.full_name)}">`
      : `<div class="member-photo placeholder">${esc(initials(m.full_name))}</div>`;
    const li = safeUrl(m.linkedin_url), web = safeUrl(m.website_url);
    const links = (li ? `<a class="member-link" href="${li}" target="_blank" rel="noopener">LinkedIn</a>` : '') + (web ? `<a class="member-link" href="${web}" target="_blank" rel="noopener">Website</a>` : '');
    return `<div class="card member-tile">
      ${photo}
      <h3 class="member-name">${esc(m.full_name)}</h3>
      ${(m.headline || m.company) ? `<div class="member-role">${esc([m.headline, m.company].filter(Boolean).join(' · '))}</div>` : ''}
      ${m.location ? `<div class="member-loc">${esc(m.location)}</div>` : ''}
      ${m.bio ? `<p class="member-bio">${esc(m.bio)}</p>` : ''}
      ${links ? `<div class="member-links">${links}</div>` : ''}
    </div>`;
  }

  (async () => {
    if (supabaseNotConfigured()) {
      document.getElementById('member-list').innerHTML = '<div class="empty-state">Not connected yet — the site owner still needs to add the Supabase project keys.</div>';
      return;
    }

    const { data: members, error } = await supabaseClient
      .from('member_directory')
      .select('*')
      .order('full_name', { ascending: true });

    const list = document.getElementById('member-list');
    if (error) {
      list.innerHTML = '<div class="empty-state">Could not load the community right now.</div>';
      return;
    }
    if (!members || !members.length) {
      list.innerHTML = '<div class="empty-state">No one has joined the showcase yet — be the first! <a href="signup.html">Sign up</a> and turn on "Show me on Know Your Community" in your profile.</div>';
      return;
    }
    list.innerHTML = '<div class="member-grid">' + members.map(memberCard).join('') + '</div>';
  })();
</script>

</body>
</html>
