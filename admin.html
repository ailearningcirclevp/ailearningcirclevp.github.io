<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — AI Learning Circle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shared.css">
<style>
  .type-only{display:none;}
  .type-only.show{display:block;}
</style>
</head>
<body>

<nav class="topnav">
  <a href="dashboard.html" class="brand"><img src="assets/logo.svg" alt="AI Learning Circle"></a>
  <div class="tabs">
    <a class="tab-btn" href="dashboard.html">Home</a>
    <a class="tab-btn" href="library.html">Library</a>
    <a class="tab-btn" href="sessions.html">Sessions</a>
    <a class="tab-btn" href="profile.html">Profile</a>
  </div>
</nav>

<div class="wrap" id="admin-wrap" style="visibility:hidden;">
  <div class="eyebrow" style="margin-top:20px;">Admin</div>
  <h1 style="font-size:24px;margin:4px 0 20px;">Add to the Knowledge Library</h1>

  <div id="not-admin" class="empty-state" style="display:none;"></div>

  <div id="admin-area" style="display:none;">
    <div class="section-title">Members <span style="text-transform:none;font-weight:500;">(approve paid access)</span></div>
    <div class="form-msg" id="mem-msg"></div>
    <div style="display:flex;gap:8px;margin-bottom:10px;">
      <input id="mem-search" type="search" placeholder="Search name, email or company" style="flex:1;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface-1);color:var(--ink-900);font-family:inherit;">
      <select id="mem-filter" style="padding:11px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-1);color:var(--ink-900);font-family:inherit;">
        <option value="all">All</option><option value="free">Free</option><option value="member">Paid</option><option value="admin">Admins</option>
      </select>
    </div>
    <div id="mem-count" class="hint" style="margin-bottom:8px;"></div>
    <div id="mem-list" style="margin-bottom:34px;"><div class="empty-state">Loading…</div></div>

    <div class="form-msg" id="form-msg"></div>

    <form id="upload-form">
      <div class="field">
        <label for="f-type">Content type</label>
        <select id="f-type" required>
          <option value="use_case">Use Case (practice materials + how-to &amp; prompt guide + recording)</option>
          <option value="try_this_week">Try This Week</option>
          <option value="prompt">Prompt Library</option>
        </select>
      </div>

      <div class="field">
        <label for="f-category">Category</label>
        <select id="f-category" required>
          <option value="Finance & Reporting">Finance & Reporting</option>
          <option value="Presentations">Presentations</option>
          <option value="Meetings & Productivity">Meetings & Productivity</option>
          <option value="Data & Dashboards">Data & Dashboards</option>
          <option value="AI Agents & Automation">AI Agents & Automation</option>
          <option value="General AI Skills">General AI Skills</option>
          <option value="__other">Other (type below)</option>
        </select>
      </div>
      <div class="field type-only" id="f-category-other-wrap"><input id="f-category-other" type="text" placeholder="Category name"></div>

      <div class="field"><label for="f-title">Title</label><input id="f-title" type="text" required></div>

      <div class="field"><label for="f-description">Short description</label><textarea id="f-description" rows="3" placeholder="What is this and who is it for?"></textarea></div>

      <div id="use-case-fields" class="type-only">
        <div class="field"><label for="f-problem">Business problem</label><textarea id="f-problem" rows="2"></textarea></div>
        <div class="field"><label for="f-learn">What you'll learn</label><textarea id="f-learn" rows="2"></textarea></div>
        <div class="field"><label for="f-tool">Tool used</label><input id="f-tool" type="text" placeholder="e.g. ChatGPT, Claude, Copilot"></div>
        <div class="field"><label for="f-transfer">Tool transferability note <span class="hint">(optional)</span></label><textarea id="f-transfer" rows="2" placeholder="Can this be done with another tool?"></textarea></div>
        <div class="field"><label for="f-level">Level</label>
          <select id="f-level">
            <option value="">—</option>
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
        </div>
      </div>

      <div class="field"><label for="f-recording">Session Recording link <span class="hint">(optional)</span></label><input id="f-recording" type="url" placeholder="https://…"></div>

      <div class="field" id="f-main-wrap"><label for="f-file" id="f-file-label">Use Case Practice Materials <span class="hint">(for trying it yourself — optional file)</span></label><input id="f-file" type="file">
        <input id="f-file-link" type="url" placeholder="…or paste a Google Drive / cloud link (https://…)" style="margin-top:6px;"></div>
      <div id="use-case-files" class="type-only">
        <div class="field" style="display:none;"><label for="f-cheat">Cheat sheet — 2 min read <span class="hint">(optional file)</span></label><input id="f-cheat" type="file">
        <input id="f-cheat-link" type="url" placeholder="…or paste a Google Drive / cloud link (https://…)" style="margin-top:6px;"></div>
        <div class="field"><label for="f-kit">How-To &amp; Prompt Guide <span class="hint">(steps, prompts &amp; Copilot instructions — optional file)</span></label><input id="f-kit" type="file">
        <input id="f-kit-link" type="url" placeholder="…or paste a Google Drive / cloud link (https://…)" style="margin-top:6px;"></div>
      </div>

      <button class="btn btn-primary" type="submit" style="width:100%;margin-top:6px;">Add to Knowledge Library</button>
    </form>

    <div class="section-title" style="margin-top:36px;">Post a free AI tip <span style="text-transform:none;font-weight:500;">(visible to free users)</span></div>
    <div class="form-msg" id="tip-msg"></div>
    <form id="tip-form">
      <div class="field"><label for="t-title">Title</label><input id="t-title" type="text" required></div>
      <div class="field"><label for="t-body">Tip (paste text)</label><textarea id="t-body" rows="5" required></textarea></div>
      <button class="btn btn-primary" type="submit" style="width:100%;">Post tip</button>
    </form>
    <div id="tip-list" style="margin-top:14px;"></div>

    <div class="section-title" style="margin-top:36px;">Participant Feedback <span style="text-transform:none;font-weight:500;">(anonymous ticker, shown only under Completed sessions)</span></div>
    <div class="form-msg" id="fb-msg"></div>
    <div class="field"><label for="fb-session">Session</label><select id="fb-session"></select></div>
    <form id="fb-form" style="display:flex;gap:8px;">
      <input id="fb-new" type="text" placeholder="Add a comment (plain text, no names)" required style="flex:1;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface-1);color:var(--ink-900);font-family:inherit;font-size:14.5px;">
      <button class="btn btn-primary" type="submit">Add</button>
    </form>
    <div id="fb-list" style="margin-top:12px;"></div>

    <div class="section-title" style="margin-top:36px;">Existing materials</div>
    <div id="resource-list"><div class="empty-state">Loading…</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/member-menu.js"></script>
<script src="assets/sessions.js"></script>
<script>
  let member = null;
  let editing = null;        // resource row being edited, or null when adding
  let resourceCache = [];

  document.getElementById('f-category').addEventListener('change', (e) => {
    document.getElementById('f-category-other-wrap').classList.toggle('show', e.target.value === '__other');
  });
  function syncTypeFields() {
    const isUseCase = document.getElementById('f-type').value === 'use_case';
    document.getElementById('use-case-fields').classList.toggle('show', isUseCase);
    document.getElementById('use-case-files').classList.toggle('show', isUseCase);
    document.getElementById('f-file-label').firstChild.textContent = isUseCase ? 'Use Case Practice Materials ' : 'File ';
  }
  document.getElementById('f-type').addEventListener('change', syncTypeFields);
  syncTypeFields();

  function adminRow(r) {
    const label = RESOURCE_TYPE_LABELS[r.type] || r.type;
    return `<div class="admin-row" id="row-${r.id}">
      <div>
        <div class="title">${r.title}</div>
        <div class="meta">${label} · ${r.category}</div>
      </div>
      <button class="btn btn-secondary" data-edit="${r.id}" style="margin-right:6px;">Edit</button>
      <button class="btn btn-danger" data-id="${r.id}" data-paths="${[r.file_path, r.cheat_sheet_path, r.starter_kit_path].filter(Boolean).join(',')}">Delete</button>
    </div>`;
  }

  async function loadResources() {
    const { data: resources } = await supabaseClient.from('resources').select('*').order('created_at', { ascending: false });
    const list = document.getElementById('resource-list');
    if (!resources || !resources.length) {
      list.innerHTML = '<div class="empty-state">Nothing uploaded yet.</div>';
      return;
    }
    resourceCache = resources;
    list.innerHTML = resources.map(adminRow).join('');
    list.querySelectorAll('[data-edit]').forEach(btn => {
      btn.addEventListener('click', () => startEdit(btn.dataset.edit));
    });
    list.querySelectorAll('.btn-danger').forEach(btn => {
      btn.addEventListener('click', () => deleteResource(btn.dataset.id, btn.dataset.paths));
    });
  }

  function submitLabel() { return editing ? 'Save changes' : 'Add to Knowledge Library'; }

  function setCurrentHint(inputId, path, name) {
    const linkEl = document.getElementById(inputId + '-link');
    if (!linkEl) return;
    let hint = document.getElementById(inputId + '-current');
    if (!hint) {
      hint = document.createElement('div');
      hint.id = inputId + '-current';
      hint.className = 'hint';
      hint.style.marginTop = '4px';
      linkEl.insertAdjacentElement('afterend', hint);
    }
    if (editing && path) {
      hint.textContent = 'Current: ' + (/^https?:\/\//i.test(path) ? path : (name || path)) + ' — leave both empty to keep it, or add a new file/link to replace it.';
    } else {
      hint.textContent = '';
    }
  }

  function startEdit(id) {
    const r = resourceCache.find(x => x.id === id);
    if (!r) return;
    editing = r;
    const form = document.getElementById('upload-form');
    form.reset();
    document.getElementById('f-type').value = r.type;
    syncTypeFields();
    const sel = document.getElementById('f-category');
    const hasOpt = Array.from(sel.options).some(o => o.value === r.category);
    if (hasOpt) { sel.value = r.category; }
    else { sel.value = '__other'; document.getElementById('f-category-other').value = r.category || ''; }
    document.getElementById('f-category-other-wrap').classList.toggle('show', !hasOpt);
    document.getElementById('f-title').value = r.title || '';
    document.getElementById('f-description').value = r.description || '';
    document.getElementById('f-recording').value = r.recording_url || '';
    document.getElementById('f-problem').value = r.business_problem || '';
    document.getElementById('f-learn').value = r.what_you_learn || '';
    document.getElementById('f-tool').value = r.tool_used || '';
    document.getElementById('f-transfer').value = r.tool_transferability_note || '';
    document.getElementById('f-level').value = r.level || '';
    setCurrentHint('f-file', r.file_path, r.file_name);
    setCurrentHint('f-cheat', r.cheat_sheet_path, r.cheat_sheet_name);
    setCurrentHint('f-kit', r.starter_kit_path, r.starter_kit_name);
    document.getElementById('f-type').disabled = true;
    const btn = form.querySelector('button[type="submit"]');
    btn.textContent = submitLabel();
    let cancel = document.getElementById('edit-cancel');
    if (!cancel) {
      cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.id = 'edit-cancel';
      cancel.className = 'btn btn-secondary';
      cancel.style.cssText = 'width:100%;margin-top:8px;';
      cancel.textContent = 'Cancel editing';
      cancel.addEventListener('click', exitEdit);
      btn.insertAdjacentElement('afterend', cancel);
    }
    msg.textContent = 'Editing “' + (r.title || '') + '”';
    msg.className = 'form-msg show ok';
    form.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function exitEdit() {
    editing = null;
    const form = document.getElementById('upload-form');
    form.reset();
    document.getElementById('f-type').disabled = false;
    syncTypeFields();
    document.getElementById('f-category-other-wrap').classList.remove('show');
    ['f-file', 'f-cheat', 'f-kit'].forEach(id => setCurrentHint(id, null, null));
    const cancel = document.getElementById('edit-cancel');
    if (cancel) cancel.remove();
    form.querySelector('button[type="submit"]').textContent = submitLabel();
  }

  async function deleteResource(id, paths) {
    if (!confirm('Delete this item from the library? This cannot be undone.')) return;
    const list = (paths || '').split(',').filter(p => p && !/^https?:\/\//i.test(p));
    if (list.length) {
      await supabaseClient.storage.from('library-files').remove(list);
    }
    await supabaseClient.from('resources').delete().eq('id', id);
    const row = document.getElementById('row-' + id);
    if (row) row.remove();
  }

  const msg = document.getElementById('form-msg');

  const escH = (t) => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  async function loadTips() {
    const { data } = await supabaseClient.from('tips').select('*').order('created_at', { ascending: false });
    const el = document.getElementById('tip-list');
    el.innerHTML = (data || []).map(t => `<div class="admin-row" id="tip-${t.id}"><div><div class="title">${escH(t.title)}</div><div class="meta">${new Date(t.created_at).toLocaleDateString()}</div></div><button class="btn btn-danger" data-tip="${t.id}">Delete</button></div>`).join('');
    el.querySelectorAll('[data-tip]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('Delete this tip?')) return;
      await supabaseClient.from('tips').delete().eq('id', b.dataset.tip);
      loadTips();
    }));
  }
  document.getElementById('tip-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const tm = document.getElementById('tip-msg');
    const { error } = await supabaseClient.from('tips').insert({
      title: document.getElementById('t-title').value.trim(),
      body: document.getElementById('t-body').value.trim()
    });
    tm.textContent = error ? error.message : 'Tip posted.';
    tm.className = 'form-msg show ' + (error ? 'error' : 'ok');
    if (!error) { e.target.reset(); loadTips(); }
  });

  document.getElementById('upload-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = editing ? 'Saving…' : 'Uploading…';

    try {
      const type = document.getElementById('f-type').value;
      const categorySel = document.getElementById('f-category').value;
      const category = categorySel === '__other' ? document.getElementById('f-category-other').value.trim() : categorySel;
      const title = document.getElementById('f-title').value.trim();
      const description = document.getElementById('f-description').value.trim() || null;
      const recording_url = document.getElementById('f-recording').value.trim() || null;
      const fileInput = document.getElementById('f-file');

      if (!category) { msg.textContent = 'Please choose or enter a category.'; msg.className = 'form-msg show error'; submitBtn.disabled = false; submitBtn.textContent = submitLabel(); return; }

      async function uploadFile(inputId) {
        const input = document.getElementById(inputId);
        if (!input.files || !input.files[0]) {
          // No file chosen: accept a pasted cloud link (Google Drive, OneDrive, etc.) instead.
          const linkEl = document.getElementById(inputId + '-link');
          const link = linkEl ? linkEl.value.trim() : '';
          if (!link) return [null, null];
          if (!/^https?:\/\//i.test(link)) throw new Error('Links must start with https://');
          return [link, null];
        }
        const file = input.files[0];
        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
        const path = `${type}/${Date.now()}_${inputId}_${safeName}`;
        const { error: uploadError } = await supabaseClient.storage.from('library-files').upload(path, file);
        if (uploadError) throw uploadError;
        return [path, file.name];
      }
      const [file_path, file_name] = await uploadFile('f-file');

      const row = { type, category, title, description, recording_url };
      if (!editing || file_path) { row.file_path = file_path; row.file_name = file_name; }
      if (type === 'use_case') {
        const [cp, cn] = await uploadFile('f-cheat');
        const [kp, kn] = await uploadFile('f-kit');
        if (!editing || cp) { row.cheat_sheet_path = cp; row.cheat_sheet_name = cn; }
        if (!editing || kp) { row.starter_kit_path = kp; row.starter_kit_name = kn; }
        row.business_problem = document.getElementById('f-problem').value.trim() || null;
        row.what_you_learn = document.getElementById('f-learn').value.trim() || null;
        row.tool_used = document.getElementById('f-tool').value.trim() || null;
        row.tool_transferability_note = document.getElementById('f-transfer').value.trim() || null;
        row.level = document.getElementById('f-level').value || null;
      }

      if (editing) {
        const { error: updateError } = await supabaseClient.from('resources').update(row).eq('id', editing.id);
        if (updateError) throw updateError;
        // Clean up any stored file that was just replaced (links aren't stored files).
        const replaced = [
          ['file_path', 'file_path'], ['cheat_sheet_path', 'cheat_sheet_path'], ['starter_kit_path', 'starter_kit_path']
        ].filter(([k]) => row[k] && editing[k] && row[k] !== editing[k] && !/^https?:\/\//i.test(editing[k]))
         .map(([k]) => editing[k]);
        if (replaced.length) { await supabaseClient.storage.from('library-files').remove(replaced); }
      } else {
        const { error: insertError } = await supabaseClient.from('resources').insert(row);
        if (insertError) throw insertError;
      }

      const wasEditing = !!editing;
      exitEdit();
      msg.textContent = wasEditing ? 'Changes saved.' : 'Added to the library.';
      msg.className = 'form-msg show ok';
      loadResources();
    } catch (err) {
      msg.textContent = err.message || 'Something went wrong.';
      msg.className = 'form-msg show error';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = submitLabel();
    }
  });


  // ---------- Participant feedback ----------
  const fbSel = document.getElementById('fb-session');
  const fbMsg = document.getElementById('fb-msg');
  function fbFlash(text, ok) { fbMsg.textContent = text; fbMsg.className = 'form-msg show ' + (ok ? 'ok' : 'error'); }
  fbSel.innerHTML = sessions.map(s => `<option value="${s.id}">${escH(s.title)} — ${escH(s.date)} (${s.status === 'completed' ? 'Completed' : s.status})</option>`).join('');
  fbSel.value = (sessions.find(s => s.status === 'completed') || sessions[0] || {}).id || '';

  async function loadFeedback() {
    const { data, error } = await supabaseClient.from('session_feedback').select('*')
      .eq('session_id', fbSel.value).order('sort_order', { ascending: true }).order('created_at', { ascending: true });
    const el = document.getElementById('fb-list');
    if (error) { el.innerHTML = '<div class="empty-state">' + escH(error.message) + '</div>'; return; }
    if (!data.length) { el.innerHTML = '<div class="empty-state">No feedback for this session yet — nothing is shown on the site.</div>'; return; }
    el.innerHTML = data.map((c, i) => `<div class="admin-row" data-id="${c.id}" style="align-items:center;">
      <input type="text" value="${escH(c.comment)}" style="flex:1;min-width:0;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface-1);color:var(--ink-900);font-family:inherit;font-size:14px;">
      <div style="display:flex;gap:6px;">
        <button class="btn btn-secondary" data-act="up" ${i === 0 ? 'disabled' : ''} title="Move up">↑</button>
        <button class="btn btn-secondary" data-act="down" ${i === data.length - 1 ? 'disabled' : ''} title="Move down">↓</button>
        <button class="btn btn-dark" data-act="save">Save</button>
        <button class="btn btn-danger" data-act="del">Delete</button>
      </div></div>`).join('');
    el.querySelectorAll('.admin-row').forEach((row, i) => {
      row.querySelectorAll('button').forEach(b => b.addEventListener('click', async () => {
        const id = row.dataset.id, act = b.dataset.act;
        if (act === 'save') {
          const { error: e } = await supabaseClient.from('session_feedback').update({ comment: row.querySelector('input').value.trim() }).eq('id', id);
          fbFlash(e ? e.message : 'Saved.', !e);
        } else if (act === 'del') {
          if (!confirm('Delete this comment?')) return;
          const { error: e } = await supabaseClient.from('session_feedback').delete().eq('id', id);
          fbFlash(e ? e.message : 'Deleted.', !e); loadFeedback();
        } else {
          const j = act === 'up' ? i - 1 : i + 1;
          const a = data[i], c = data[j];
          // write explicit positions so ordering is stable
          await Promise.all(data.map((d, k) => {
            const pos = k === i ? j : k === j ? i : k;
            return supabaseClient.from('session_feedback').update({ sort_order: pos }).eq('id', d.id);
          }));
          loadFeedback();
        }
      }));
    });
  }
  fbSel.addEventListener('change', loadFeedback);
  document.getElementById('fb-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('fb-new');
    const text = input.value.trim();
    if (!text) return;
    const { data: last } = await supabaseClient.from('session_feedback').select('sort_order').eq('session_id', fbSel.value).order('sort_order', { ascending: false }).limit(1);
    const next = last && last.length ? last[0].sort_order + 1 : 0;
    const { error } = await supabaseClient.from('session_feedback').insert({ session_id: fbSel.value, comment: text, sort_order: next });
    fbFlash(error ? error.message : 'Comment added.', !error);
    if (!error) { input.value = ''; loadFeedback(); }
  });

  // ---------- Members: approve / remove paid access ----------
  let allMembers = [];
  const memRoleLabel = { free: 'Free', member: 'Paid', admin: 'Admin', pending: 'Pending' };
  function renderMembers() {
    const q = document.getElementById('mem-search').value.trim().toLowerCase();
    const f = document.getElementById('mem-filter').value;
    const rows = allMembers.filter(m =>
      (f === 'all' || m.role === f) &&
      (!q || [m.full_name, m.email, m.company, m.headline].some(v => (v || '').toLowerCase().includes(q))));
    const paid = allMembers.filter(m => m.role === 'member').length;
    document.getElementById('mem-count').textContent = allMembers.length + ' signed up · ' + paid + ' paid · showing ' + rows.length;
    const el = document.getElementById('mem-list');
    if (!rows.length) { el.innerHTML = '<div class="empty-state">No members match.</div>'; return; }
    el.innerHTML = rows.map(m => {
      const self = m.id === member.id;
      let action = '';
      if (m.role === 'admin') action = '<span class="meta">Admin</span>';
      else if (m.role === 'member') action = '<button class="btn btn-danger" data-mid="' + m.id + '" data-role="free">Remove paid access</button>';
      else action = '<button class="btn btn-primary" data-mid="' + m.id + '" data-role="member">Approve as paid</button>';
      const dirBtn = m.show_in_directory
        ? '<button class="btn btn-secondary" style="margin-top:6px;padding:8px 14px;font-size:13px;" data-dir="' + m.id + '" data-show="false">Remove from community page</button>'
        : '';
      return '<div class="admin-row"><div><div class="title">' + escH(m.full_name || '(no name)') + ' <span class="meta">· ' + (memRoleLabel[m.role] || m.role) + (self ? ' · you' : '') + '</span></div>' +
        '<div class="meta">' + escH(m.email || '') + (m.company ? ' · ' + escH(m.company) : '') + (m.headline ? ' · ' + escH(m.headline) : '') + ' · joined ' + new Date(m.created_at).toLocaleDateString() + (m.show_in_directory ? ' · <b>on community page</b>' : '') + '</div>' + dirBtn + '</div>' +
        (self ? '' : action) + '</div>';
    }).join('');
    el.querySelectorAll('[data-mid]').forEach(b => b.addEventListener('click', () => setMemberRole(b.dataset.mid, b.dataset.role)));
    el.querySelectorAll('[data-dir]').forEach(b => b.addEventListener('click', () => setDirectory(b.dataset.dir, false)));
  }
  async function loadMembers() {
    const { data, error } = await supabaseClient.from('members')
      .select('id, full_name, email, company, headline, role, created_at, show_in_directory').order('created_at', { ascending: false });
    const mm = document.getElementById('mem-msg');
    if (error) {
      mm.textContent = 'Could not load members: ' + error.message + ' (run supabase/migration_members_admin.sql once in Supabase).';
      mm.className = 'form-msg show error';
      document.getElementById('mem-list').innerHTML = '';
      return;
    }
    allMembers = data || [];
    renderMembers();
  }
  async function setDirectory(id, show) {
    const m = allMembers.find(x => x.id === id);
    if (!confirm('Remove ' + (m && m.full_name || 'this person') + ' from the Know Your Community page? Their account stays active.')) return;
    const { error } = await supabaseClient.from('members').update({ show_in_directory: show }).eq('id', id);
    const mm = document.getElementById('mem-msg');
    if (error) { mm.textContent = error.message; mm.className = 'form-msg show error'; return; }
    mm.textContent = 'Removed from the community page.';
    mm.className = 'form-msg show ok';
    loadMembers();
  }
  async function setMemberRole(id, role) {
    const m = allMembers.find(x => x.id === id);
    const verb = role === 'member' ? 'Approve ' + (m && m.full_name || 'this person') + ' as a PAID member? They will get full Knowledge Library access.'
                                   : 'Remove paid access for ' + (m && m.full_name || 'this person') + '? They will go back to free.';
    if (!confirm(verb)) return;
    const { error } = await supabaseClient.from('members').update({ role }).eq('id', id);
    const mm = document.getElementById('mem-msg');
    if (error) { mm.textContent = error.message; mm.className = 'form-msg show error'; return; }
    mm.textContent = role === 'member' ? 'Approved as paid member.' : 'Moved back to free.';
    mm.className = 'form-msg show ok';
    loadMembers();
  }
  document.getElementById('mem-search').addEventListener('input', renderMembers);
  document.getElementById('mem-filter').addEventListener('change', renderMembers);

  (async () => {
    if (supabaseNotConfigured()) {
      document.getElementById('admin-wrap').style.visibility = 'visible';
      document.getElementById('not-admin').style.display = 'block';
      document.getElementById('not-admin').textContent = 'Not connected yet — the site owner still needs to add the Supabase project keys.';
      return;
    }

    const session = await requireMember();
    if (!session) return;

    member = await getMemberRecord(session.user.id);
    if (!member || member.role !== 'admin') {
      window.location.replace('dashboard.html');
      return;
    }
    document.querySelector('.tabs').insertAdjacentHTML('beforeend', '<a class="tab-btn active" href="admin.html">Admin</a>');

    document.getElementById('admin-wrap').style.visibility = 'visible';
    document.getElementById('admin-area').style.display = 'block';
    loadMembers();
    loadResources();
    loadTips();
    loadFeedback();
  })();
</script>

</body>
</html>
